
name: Build SynthOS APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      archive_path:
        description: 'Path to app ZIP'
        required: false
        default: 'app-release.zip'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate app ZIP
        id: archive
        shell: bash
        env:
          REQUESTED_ARCHIVE: ${{ inputs.archive_path || 'app-release.zip' }}
        run: |
          set -euo pipefail

          requested="$REQUESTED_ARCHIVE"

          if [[ -f "$requested" ]]; then
            archive="$requested"
          else
            archive="$(find . -maxdepth 7 \
              -type f \
              -name "$(basename "$requested")" \
              -not -path './.git/*' \
              -print -quit || true)"
          fi

          if [[ -z "${archive:-}" || ! -f "$archive" ]]; then
            echo "::error::Cannot find app ZIP: $requested"
            find . -maxdepth 4 -type f -print | head -200
            exit 1
          fi

          echo "path=$archive" >> "$GITHUB_OUTPUT"
          echo "Found archive: $archive"

      - name: Extract app ZIP safely
        id: extract
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          set -euo pipefail

          destination="$RUNNER_TEMP/synthos-unpacked"
          mkdir -p "$destination"

          python3 - "$ARCHIVE" "$destination" <<'PY'
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          root = pathlib.Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (root / item.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(
                          f"Unsafe archive path: {item.filename}"
                      )
              z.extractall(root)

          print(f"Extracted into {root}")
          PY

          echo "dir=$destination" >> "$GITHUB_OUTPUT"

      - name: Locate prebuilt APK
        id: prebuilt
        shell: bash
        env:
          EXTRACT_DIR: ${{ steps.extract.outputs.dir }}
        run: |
          set -euo pipefail

          apk="$EXTRACT_DIR/apk/app-release.apk"

          if [[ ! -f "$apk" ]]; then
            apk="$(find "$EXTRACT_DIR" \
              -maxdepth 8 -type f -name '*.apk' \
              -print -quit || true)"
          fi

          mkdir -p "$RUNNER_TEMP/synthos-output"

          if [[ -n "$apk" && -f "$apk" ]]; then
            cp "$apk" "$RUNNER_TEMP/synthos-output/app-release.apk"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using prebuilt APK."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No prebuilt APK found; building from source."
          fi

      - name: Set up JDK 17
        if: steps.prebuilt.outputs.found != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Do not use android-actions/setup-android here.
      # It attempts to install the obsolete SDK package "tools".
      - name: Configure preinstalled Android SDK
        if: steps.prebuilt.outputs.found != 'true'
        id: android
        shell: bash
        run: |
          set -euo pipefail

          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [[ ! -d "$sdk" ]]; then
            echo "::error::Android SDK directory not found: $sdk"
            exit 1
          fi

          if [[ -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]]; then
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          else
            manager="$(find "$sdk/cmdline-tools" \
              -type f -name sdkmanager -print 2>/dev/null \
              | sort -V | tail -n 1 || true)"
          fi

          if [[ -z "$manager" || ! -x "$manager" ]]; then
            echo "::error::Could not locate sdkmanager."
            find "$sdk/cmdline-tools" -maxdepth 4 -type f \
              -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"

          echo "sdkmanager=$manager" >> "$GITHUB_OUTPUT"
          echo "Using SDK: $sdk"
          echo "Using sdkmanager: $manager"

      - name: Install Android SDK packages
        if: steps.prebuilt.outputs.found != 'true'
        shell: bash
        env:
          SDKMANAGER: ${{ steps.android.outputs.sdkmanager }}
        run: |
          set -euo pipefail

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Locate Android source
        if: steps.prebuilt.outputs.found != 'true'
        id: source
        shell: bash
        env:
          EXTRACT_DIR: ${{ steps.extract.outputs.dir }}
        run: |
          set -euo pipefail

          src="$EXTRACT_DIR/source"

          if [[ ! -f "$src/settings.gradle" &&
                ! -f "$src/settings.gradle.kts" ]]; then
            settings="$(find "$EXTRACT_DIR" \
              -maxdepth 7 -type f \
              \( -name settings.gradle \
                 -o -name settings.gradle.kts \) \
              -print -quit || true)"

            if [[ -n "$settings" ]]; then
              src="$(dirname "$settings")"
            fi
          fi

          if [[ ! -f "$src/settings.gradle" &&
                ! -f "$src/settings.gradle.kts" ]]; then
            echo "::error::No Gradle settings file found."
            find "$EXTRACT_DIR" -maxdepth 5 -type f -print
            exit 1
          fi

          if [[ ! -f "$src/app/build.gradle" &&
                ! -f "$src/app/build.gradle.kts" ]]; then
            echo "::error::Android app Gradle file is missing."
            exit 1
          fi

          echo "Source directory: $src"
          echo "dir=$src" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.prebuilt.outputs.found != 'true'
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          if [[ -x ./gradlew ]]; then
            ./gradlew --no-daemon clean assembleRelease
          elif [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleRelease
          elif command -v gradle >/dev/null 2>&1; then
            gradle --no-daemon clean assembleRelease
          else
            echo "::error::Gradle wrapper or Gradle executable is missing."
            exit 1
          fi

          apk="$(find app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' \
            -print -quit || true)"

          if [[ -z "$apk" || ! -f "$apk" ]]; then
            echo "::error::No release APK was produced."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          cp "$apk" "$RUNNER_TEMP/synthos-output/app-release.apk"
          echo "APK produced: $apk"

      # An unsigned release APK cannot be installed.
      # Sign it with a temporary CI key if necessary.
      - name: Sign and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          apk="$RUNNER_TEMP/synthos-output/app-release.apk"

          if [[ ! -s "$apk" ]]; then
            echo "::error::APK is missing or empty."
            exit 1
          fi

          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [[ ! -x "$signer" ]]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          if ! "$signer" verify "$apk" >/dev/null 2>&1; then
            echo "APK is unsigned or its signature is invalid; signing for testing."

            keystore="$RUNNER_TEMP/synthos-ci.keystore"

            keytool -genkeypair \
              -keystore "$keystore" \
              -storepass android \
              -alias synthos-ci \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SynthOS CI,O=SynthOS,C=PL"

            "$signer" sign \
              --ks "$keystore" \
              --ks-key-alias synthos-ci \
              --ks-pass pass:android \
              --key-pass pass:android \
              "$apk"
          fi

          "$signer" verify "$apk"

          echo "APK size:"
          du -h "$apk"

          echo "SHA-256:"
          sha256sum "$apk"

          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          
